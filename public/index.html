<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3DGAME ハブ</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --sub:#8b949e; --accent:#58a6ff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
    header { padding:32px 16px 8px; text-align:center; }
    h1 { margin:0; font-size:2rem; letter-spacing:.05em; }
    header p { color:var(--sub); margin:8px 0 0; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
    a.card { display:block; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:transform .15s, border-color .15s; }
    a.card:hover, a.card:focus-visible { transform:translateY(-3px); border-color:var(--accent); outline:none; }
    .card h2 { margin:0 0 8px; font-size:1.2rem; }
    .card p { margin:0 0 12px; color:var(--sub); line-height:1.5; }
    .card small { color:var(--accent); }
    .msg { grid-column:1/-1; text-align:center; color:var(--sub); }
  </style>
</head>
<body>
  <header>
    <h1>3DGAME</h1>
    <p>遊びたいゲームを選んでください</p>
  </header>
  <main id="list"><p class="msg">読み込み中…</p></main>
  <script type="module">
    // games/*/meta.json を /api/games 経由で読み込み、カードを自動生成する（ハブは誰も編集しない）
    const list = document.getElementById('list');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    try {
      const res = await fetch('/api/games');
      if (!res.ok) throw new Error(res.status);
      const games = await res.json();
      list.innerHTML = games.length
        ? games.map((g) => `
            <a class="card" href="${esc(g.url)}">
              <h2>${esc(g.title)}</h2>
              <p>${esc(g.description)}</p>
              <small>操作：${esc(g.controls)}</small>
            </a>`).join('')
        : '<p class="msg">ゲームがまだありません</p>';
    } catch (e) {
      console.warn('ゲーム一覧の取得に失敗', e);
      list.innerHTML = '<p class="msg">ゲーム一覧を読み込めませんでした</p>';
    }
  </script>
</body>
</html>
