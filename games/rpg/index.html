<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>3DRPG | 3DGAME</title>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <style>
    html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}
    /* ---- HUD（左上は shared の hud()） ---- */
    .rpg-status{background:#0b0f16b0;border:1px solid #30363d;border-radius:10px;padding:8px 12px;min-width:250px}
    .rpg-lv{color:#ffd54f;font-size:17px}
    .rpg-area{color:#9fb1c2;font-size:13px;margin-left:6px}
    .rpg-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:3px}
    .rpg-row>span:first-child{width:22px;color:#9fb1c2}
    .rpg-bar{height:10px;background:#000a;border-radius:5px;overflow:hidden;border:1px solid #ffffff22}
    .rpg-bar>div{height:100%;transition:width .15s}
    .rpg-goal{margin-top:6px;border-top:1px solid #30363d;padding-top:4px;font-size:13px;color:#ffe082;max-width:320px}
    .rpg-tired{color:#ff7043;font-weight:bold;animation:rpgblink .5s infinite}
    .rpg-bar.tired{border-color:#ff7043;box-shadow:0 0 6px #ff704388}
    .rpg-hud-root{position:fixed;inset:0;pointer-events:none;z-index:12;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8;text-shadow:0 1px 3px #000c}
    .rpg-skills{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
    .rpg-skill{position:relative;width:70px;height:58px;background:#0b0f16c8;border:1px solid #58a6ff88;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;overflow:visible}
    .rpg-skill b{font-size:14px;color:#ffd54f}
    .rpg-skill small{color:#9fb1c2;font-size:11px}
    .rpg-skill.off{opacity:.45}
    .rpg-skill.on{border-color:#ffee58;box-shadow:0 0 8px #ffee5866}
    .rpg-skill i{position:absolute;inset:0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#000a;font-style:normal;font-size:18px;font-weight:bold}
    .rpg-map{position:absolute;right:12px;bottom:12px;border:2px solid #30363d;border-radius:10px;background:#0b0f16a0;padding:4px;line-height:0}
    .rpg-prompt{display:none;position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#0b0f16d0;border:1px solid #ffd54f88;border-radius:8px;padding:6px 14px;font-size:15px}
    .rpg-prompt b{display:inline-block;background:#ffd54f;color:#000;border-radius:4px;padding:0 6px;margin-right:6px;text-shadow:none}
    .rpg-banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:34px;font-weight:bold;letter-spacing:.2em;opacity:0;color:#fff;text-shadow:0 2px 10px #000}
    .rpg-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,40px);font-size:13px;color:#ffffffaa;display:none}
    .rpg-boss{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(520px,60vw);text-align:center}
    .rpg-boss-name{font-weight:bold;font-size:16px;color:#ffccbc}
    .rpg-boss-track{height:14px;background:#000b;border:1px solid #ff8a65;border-radius:7px;overflow:hidden;margin-top:3px}
    .rpg-boss-fill{height:100%;background:linear-gradient(90deg,#b71c1c,#ff5252);transition:width .2s}
    .rpg-boss.raged .rpg-boss-track{box-shadow:0 0 12px #ff1744}
    .rpg-cross{display:none;position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}
    .rpg-cross::before,.rpg-cross::after{content:"";position:absolute;background:#ffffffd0;box-shadow:0 0 2px #000}
    .rpg-cross::before{left:6px;top:0;width:2px;height:14px}
    .rpg-cross::after{left:0;top:6px;width:14px;height:2px}
    .rpg-vignette{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 120px 40px #ff1744;pointer-events:none}
    .rpg-danger{display:none;position:absolute;inset:0;box-shadow:inset 0 0 60px 14px #ff9100;animation:rpgblink .4s infinite;align-items:flex-end;justify-content:center;padding-bottom:150px;box-sizing:border-box}
    .rpg-danger span{background:#000a;border:1px solid #ff9100;border-radius:8px;padding:4px 14px;color:#ffcc80;font-weight:bold}
    .rpg-guardview{display:none;position:absolute;left:50%;bottom:-18vh;width:70vw;height:60vh;transform:translateX(-50%);border-radius:50% 50% 0 0;border:4px solid #80d8ffaa;background:radial-gradient(ellipse at 50% 30%,#80d8ff22,#4fc3f740 70%,#4fc3f766);box-shadow:0 0 30px #40c4ff88,inset 0 0 40px #80d8ff55;pointer-events:none}
    .rpg-skill .rpg-who{top:-17px;left:50%;right:auto;transform:translateX(-50%);white-space:nowrap}
    .rpg-who{position:absolute;top:1px;right:2px;font-style:normal;font-size:11px;font-weight:bold;line-height:1;padding:2px 4px;border-radius:5px;background:#000c;z-index:2}
    .rpg-who.heal{color:#69f0ae;border:1px solid #69f0ae88}
    .rpg-who.buff{color:#ffee58;border:1px solid #ffee5888}
    .rt-btn .rpg-who{top:6px;right:50%;transform:translateX(50%);font-size:10px}
    .rpg-revive{display:none;position:absolute;left:50%;top:62%;transform:translateX(-50%);width:min(360px,70vw);text-align:center;pointer-events:none}
    .rpg-revive span{display:inline-block;font-size:15px;font-weight:bold;color:#b9f6ca;text-shadow:0 1px 4px #000;margin-bottom:4px}
    .rpg-revive div{height:12px;background:#000b;border:1px solid #69f0ae;border-radius:6px;overflow:hidden}
    .rpg-revive i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00c853,#b9f6ca)}
    .rpg-deadeye{display:none;position:fixed;inset:0;pointer-events:none;z-index:9}
    .rpg-deadeye.on{display:block}
    .rpg-deadeye .bar{position:absolute;left:0;right:0;height:9vh;background:#000;animation:rpgbarin .35s ease-out}
    .rpg-deadeye .top{top:0}
    .rpg-deadeye .bottom{bottom:0}
    @keyframes rpgbarin{from{height:0}}
    .rpg-deadeye .vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 60px #2b0a00cc}
    .rpg-deadeye .grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;background-repeat:repeat}
    .rpg-deadeye .meter{position:absolute;left:50%;bottom:calc(9vh + 70px);transform:translateX(-50%);width:min(380px,70vw);text-align:center;font-family:Georgia,'Times New Roman',serif;color:#ffe0b2;text-shadow:0 1px 4px #000}
    .rpg-deadeye .meter b{display:block;font-size:22px;letter-spacing:.35em;color:#ff5252}
    .rpg-deadeye .meter span{font-size:14px}
    .rpg-deadeye .meter div{height:10px;margin-top:4px;background:#000a;border:1px solid #ff8a65;border-radius:5px;overflow:hidden}
    .rpg-deadeye .meter u{display:block;height:100%;width:0}
    .rpg-closein{display:none;position:absolute;left:50%;bottom:84px;transform:translateX(-50%);font-size:12px;font-weight:bold;color:#ffcc80;background:#3e1a00b0;border:1px solid #ff9800;border-radius:6px;padding:2px 10px;pointer-events:none}
    .rpg-rank{display:none;position:absolute;right:12px;top:120px;width:300px;background:#0b0f16e0;border:2px solid #c9a227;border-radius:12px;padding:10px 14px;pointer-events:none;box-shadow:0 6px 24px #000a}
    .rpg-rank h4{margin:0 0 6px;color:#ffd54f;font-size:16px;text-align:center}
    .rpg-rank .rk{display:flex;flex-direction:column;gap:6px}
    .rpg-rank h5{margin:0 0 2px;font-size:12px;color:#9fb1c2}
    .rpg-rank ol{list-style:none;margin:0;padding:0}
    .rpg-rank li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:1px 0}
    .rpg-rank li small{color:#9fb1c2;font-size:11px;margin-left:5px}
    .rpg-rank li b{color:#ffecb3}
    .rpg-rank li.none{color:#607080}
    .rpg-ultwarn{display:none;position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 10px #ff1744;animation:rpgultblink .35s infinite;align-items:flex-start;justify-content:center;padding-top:126px;box-sizing:border-box;z-index:2}
    .rpg-ultwarn-box{display:flex;flex-direction:column;align-items:center;gap:3px;background:#1a000599;border:2px solid #ff1744;border-radius:12px;padding:8px 22px;box-shadow:0 0 24px #ff174488}
    .rpg-ultwarn-box b{color:#ff8a80;font-size:17px;letter-spacing:.08em}
    .rpg-ultwarn-box big{color:#fff;font-size:30px;font-weight:bold;letter-spacing:.15em;text-shadow:0 0 12px #ff1744,0 2px 6px #000}
    .rpg-ultwarn-box small{color:#ffe082;font-size:15px;font-weight:bold}
    @keyframes rpgultblink{50%{box-shadow:inset 0 0 22px 3px #ff174466}}
    .rpg-ultflash{position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;mix-blend-mode:screen}
    .rpg-marker{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
    .rpg-marker i{position:absolute;left:-16px;top:-190px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:26px solid #ff1744;filter:drop-shadow(0 0 4px #000)}
    .rpg-fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15}
    .rpg-dmg-layer{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
    .rpg-dmg{position:absolute;left:0;top:0;font:bold 19px system-ui,sans-serif;text-shadow:0 0 3px #000,0 2px 4px #000;white-space:nowrap}
    /* ---- モーダル（看板の文） ---- */
    .rpg-modal{position:fixed;z-index:18;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8}
    .rpg-talk{left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,92vw);background:#0d1424ee;border:2px solid #c9a227;border-radius:12px;padding:14px 20px;cursor:pointer;box-shadow:0 8px 30px #000a}
    .rpg-talk-name{color:#ffd54f;font-weight:bold;margin-bottom:6px}
    .rpg-talk-text{font-size:17px;line-height:1.7;min-height:3em}
    .rpg-talk-next{text-align:right;color:#9fb1c2;font-size:12px;animation:rpgblink 1s infinite}
    @keyframes rpgblink{50%{opacity:.4}}
    /* ---- 必殺ゲージ・ブレイク・パーティ ---- */
    .rpg-skill.ready{border-color:#ffee58;box-shadow:0 0 10px #ffee58aa;animation:rpgblink .8s infinite}
    .rpg-gauge{position:absolute;left:0;bottom:0;height:4px;background:#ffee58;border-radius:0 0 0 8px}
    .rpg-brk{height:6px;background:#000b;border:1px solid #ffee5888;border-radius:3px;overflow:hidden;margin-top:3px}
    .rpg-brk>div{height:100%;background:linear-gradient(90deg,#f9a825,#ffee58);transition:width .2s}
    .rpg-boss.stun .rpg-brk{box-shadow:0 0 10px #ffee58}
    .rpg-party{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;font-size:12px}
    .rpg-party>div{background:#0b0f16b0;border:1px solid #30363d;border-radius:8px;padding:4px 8px;min-width:170px}
    .rpg-party .down{color:#ff5252;font-weight:bold}
    /* ---- レイドの準備画面 ---- */
    .rpg-lobby{position:fixed;inset:0;z-index:20;background:#05070bcc;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8;overflow:auto;padding:16px;box-sizing:border-box}
    .rpg-lobby-panel{background:#0d1424f2;border:1px solid #30363d;border-radius:14px;padding:12px 18px;width:min(1040px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
    .rpg-lobby h2{margin:0 0 6px;color:#ffd54f;font-size:20px}
    .rpg-small{font-size:12px;color:#9fb1c2;line-height:1.6}
    .rpg-lobby-msg{color:#ffcc80}
    .rpg-lobby-row{margin:8px 0}
    .rpg-lobby input{background:#000a;border:1px solid #58a6ff88;color:#fff;border-radius:6px;padding:6px 8px;font-size:14px}
    .rpg-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
    .rpg-job{text-align:left;background:#0b0f16;border:2px solid #30363d;border-radius:10px;color:#dfe7ef;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.45;font-family:inherit}
    .rpg-job b{font-size:16px;color:var(--c)}
    .rpg-job .role{color:#9fb1c2}
    .rpg-job em{font-style:normal;background:#ffd54f;color:#000;border-radius:3px;padding:0 4px;margin-right:4px;font-weight:bold}
    .rpg-job .trait{color:#ffe082}
    .rpg-job.sel{border-color:var(--c);box-shadow:0 0 12px var(--c);background:#141c2e}
    .rpg-lobby-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .rpg-join{display:inline-flex;gap:6px;align-items:center}
    .rpg-room{background:#0b0f16;border:1px solid #30363d;border-radius:10px;padding:8px 12px;margin:8px 0}
    .rpg-room-code{font-size:26px;letter-spacing:.2em;color:#ffd54f}
    .rpg-members{margin:6px 0;padding-left:18px;line-height:1.8}
    /* ---- 全滅時の職業の選び直し（小さめのカード） ---- */
    .rpg-jobpick{z-index:25}
    /* ---- 職業のタブと小さなカード（スクロールしなくても収まる） ---- */
    .rpg-tabs{display:flex;gap:6px;margin:8px 0 6px}
    .rpg-tab{background:#0b0f16;border:1px solid #30363d;border-radius:8px;color:#9fb1c2;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
    .rpg-tab b{color:#ffd54f;font-size:14px;margin-right:4px}
    .rpg-tab.on{border-color:#ffd54f;color:#fff;background:#1a2233}
    .rpg-jobgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
    .rpg-jobc{background:#0b0f16;border:2px solid #30363d;border-radius:8px;color:#dfe7ef;padding:4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;font:inherit;font-size:11px;line-height:1.3;min-width:0}
    .rpg-jobc b{color:var(--c);font-size:14px;white-space:nowrap}
    .rpg-jobc span{color:#9fb1c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .rpg-jobc.sel{border-color:var(--c);box-shadow:0 0 10px var(--c);background:#141c2e}
    .rpg-jobinfo{margin:6px 0;background:#0b0f16;border:1px solid var(--c);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.55}
    .rpg-jobinfo b{color:var(--c);font-size:15px}
    .rpg-jobinfo em{font-style:normal;background:#ffd54f;color:#000;border-radius:3px;padding:0 4px;margin-right:4px;font-weight:bold}
    .rpg-jobinfo .trait{color:#ffe082}
    @media (max-width:900px){.rpg-jobgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    /* ---- ルームの参加者（横並びの札）と準備完了のチェック ---- */
    .rpg-room .rpg-members{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0;padding:0;line-height:1.4}
    .rpg-mem{background:#141c2e;border:1px solid #30363d;border-radius:8px;padding:3px 8px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
    .rpg-mem.ready{border-color:#69f0ae}
    .rpg-check{font-style:normal;color:#00e676;font-weight:bold;font-size:15px;text-shadow:0 0 6px #00e67688}
    .g3-btn[disabled]{opacity:.45;cursor:not-allowed}
    /* ---- 頭上の名前と HP バー ---- */
    .rpg-plates{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
    .rpg-plate{position:absolute;left:0;top:0;text-align:center;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;font-size:12px;white-space:nowrap}
    .rpg-plate small{color:#cfd8dc;font-size:10px}
    .rpg-plate .bar{width:70px;height:6px;margin:2px auto 0;background:#000b;border:1px solid #ffffff44;border-radius:3px;overflow:hidden}
    .rpg-plate .bar>div{height:100%}
    .rpg-plate .dn{color:#ff5252;font-weight:bold}
    .rpg-plate.pinch .bar{border-color:#ff1744;box-shadow:0 0 8px #ff1744}
    .rpg-plate.pinch .nm{animation:rpgpinch .5s infinite}
    @keyframes rpgpinch{50%{color:#ff1744;text-shadow:0 0 8px #ff1744}}
    .rpg-plate.boss{font-size:14px;font-weight:bold;color:#ffccbc}
    .rpg-plate.boss .bar{width:120px;height:8px;border-color:#ff8a65}
    .rpg-plate.boss .bar>div{background:linear-gradient(90deg,#b71c1c,#ff5252)}
    .rpg-plate.boss.stun .bar{box-shadow:0 0 8px #ffee58}
    .rpg-jobs-small{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
    .rpg-jobs-small .rpg-job{padding:6px 8px;font-size:11px}
    .rpg-jobs-small .rpg-job b{font-size:14px}
    /* ---- スマホ（横持ち）のタッチ操作（src/ui/touch.js） ---- */
    .rpg-touch{position:fixed;inset:0;z-index:13;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,"Hiragino Sans",sans-serif}
    .rt-look{position:absolute;inset:0}
    .rt-stick{position:absolute;left:110px;bottom:0;top:auto;width:0;height:0;pointer-events:none;transform:translateY(-120px);opacity:.45}
    .rt-stick.on{transform:none;opacity:1}
    .rt-base{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff66;background:#0b0f1666}
    .rt-knob{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:#ffffffaa;box-shadow:0 0 8px #000a}
    .rt-stick.dash .rt-knob{background:#ffee58;box-shadow:0 0 12px #ffee58}
    .rt-btn{position:absolute;border-radius:50%;border:2px solid #ffffff55;background:#0b0f16a8;color:#fff;font:bold 13px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
    .rt-btn b{font-size:16px;color:#ffd54f;line-height:1}
    .rt-btn span{font-size:9px;font-weight:normal;color:#cfd8dc;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rt-btn i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-style:normal;font-size:18px}
    .rt-btn u{position:absolute;left:0;right:0;bottom:0;background:#ffee5855;text-decoration:none;pointer-events:none}
    .rt-btn.down{background:#ffffff40;border-color:#fff}
    .rt-btn.off{opacity:.55}
    .rt-btn.ready{border-color:#ffee58;box-shadow:0 0 12px #ffee58;animation:rpgblink .8s infinite;opacity:1}
    .rt-atk{right:calc(24px + env(safe-area-inset-right));bottom:24px;width:92px;height:92px;font-size:16px;border-color:#ff8a65aa}
    .rt-dodge{right:calc(128px + env(safe-area-inset-right));bottom:16px;width:60px;height:60px}
    .rt-q{right:calc(138px + env(safe-area-inset-right));bottom:88px;width:62px;height:62px}
    .rt-e{right:calc(84px + env(safe-area-inset-right));bottom:140px;width:62px;height:62px}
    .rt-r{right:calc(16px + env(safe-area-inset-right));bottom:132px;width:62px;height:62px}
    .rt-c{right:calc(208px + env(safe-area-inset-right));bottom:86px;width:58px;height:58px}
    .rt-f{right:calc(200px + env(safe-area-inset-right));bottom:150px;width:66px;height:42px;border-radius:10px;border-color:#ffd54f;color:#ffd54f}
    .rt-top{position:absolute;top:8px;right:calc(150px + env(safe-area-inset-right));display:flex;gap:6px}
    .rt-mini{border:1px solid #30363d;background:#0d1117cc;color:#c9d1d9;border-radius:6px;font:12px system-ui,sans-serif;padding:6px 10px;touch-action:manipulation}
    .rpg-rotate{display:none;position:fixed;inset:0;z-index:60;background:#05070b;color:#fff;align-items:center;justify-content:center;text-align:center;font:18px/1.8 system-ui,"Hiragino Sans",sans-serif}
    .rpg-rotate b{color:#ffd54f}
    @media (orientation:portrait){body.rpg-touch-on .rpg-rotate{display:flex}}
    /* タッチ時：HUD のスキル欄はボタンに映すので消す。地図は左上の状態の下へ小さく */
    body.rpg-touch-on .rpg-skills{display:none}
    body.rpg-touch-on .rpg-map{right:auto;left:8px;bottom:auto;top:118px;transform:scale(.5);transform-origin:top left;opacity:.85}
    body.rpg-touch-on .rpg-party{top:44px}
    body.rpg-touch-on .rpg-prompt{bottom:auto;top:62%}
    body.rpg-touch-on canvas{touch-action:none}
