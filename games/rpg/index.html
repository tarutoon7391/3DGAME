<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>3DRPG | 3DGAME</title>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <style>
    html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
    html{touch-action:manipulation}
    body.rpg-touch-on{position:fixed;inset:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    body.rpg-touch-on :not(input){user-select:none;-webkit-user-select:none}
    /* ---- HUD（左上は shared の hud()） ---- */
    .rpg-status{background:#0b0f16b0;border:1px solid #30363d;border-radius:10px;padding:8px 12px;min-width:250px}
    .rpg-lv{color:#ffd54f;font-size:17px}
    .rpg-area{color:#9fb1c2;font-size:13px;margin-left:6px}
    .rpg-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:3px}
    .rpg-row>span:first-child{width:22px;color:#9fb1c2}
    .rpg-bar{height:10px;background:#000a;border-radius:5px;overflow:hidden;border:1px solid #ffffff22}
    .rpg-bar>div{height:100%;transition:width .15s}
    .rpg-goal{margin-top:6px;border-top:1px solid #30363d;padding-top:4px;font-size:13px;color:#ffe082;max-width:320px}
    .rpg-tired{color:#ff7043;font-weight:bold;animation:rpgblink .5s infinite}
    .rpg-bar.tired{border-color:#ff7043;box-shadow:0 0 6px #ff704388}
    .rpg-hud-root{position:fixed;inset:0;pointer-events:none;z-index:12;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8;text-shadow:0 1px 3px #000c}
    .rpg-skills{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
    .rpg-skill{position:relative;width:70px;height:58px;background:#0b0f16c8;border:1px solid #58a6ff88;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;overflow:hidden}
    .rpg-skill b{font-size:14px;color:#ffd54f}
    .rpg-skill small{color:#9fb1c2;font-size:11px}
    .rpg-skill.off{opacity:.45}
    .rpg-skill.on{border-color:#ffee58;box-shadow:0 0 8px #ffee5866}
    .rpg-skill i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-style:normal;font-size:18px;font-weight:bold}
    .rpg-map{position:absolute;right:12px;bottom:12px;border:2px solid #30363d;border-radius:10px;background:#0b0f16a0;padding:4px;line-height:0}
    .rpg-prompt{display:none;position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#0b0f16d0;border:1px solid #ffd54f88;border-radius:8px;padding:6px 14px;font-size:15px}
    .rpg-prompt b{display:inline-block;background:#ffd54f;color:#000;border-radius:4px;padding:0 6px;margin-right:6px;text-shadow:none}
    .rpg-banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:34px;font-weight:bold;letter-spacing:.2em;opacity:0;color:#fff;text-shadow:0 2px 10px #000}
    .rpg-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,40px);font-size:13px;color:#ffffffaa;display:none}
    .rpg-boss{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(520px,60vw);text-align:center}
    .rpg-boss-name{font-weight:bold;font-size:16px;color:#ffccbc}
    .rpg-boss-track{height:14px;background:#000b;border:1px solid #ff8a65;border-radius:7px;overflow:hidden;margin-top:3px}
    .rpg-boss-fill{height:100%;background:linear-gradient(90deg,#b71c1c,#ff5252);transition:width .2s}
    .rpg-boss.raged .rpg-boss-track{box-shadow:0 0 12px #ff1744}
    .rpg-cross{display:none;position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}
    .rpg-cross::before,.rpg-cross::after{content:"";position:absolute;background:#ffffffd0;box-shadow:0 0 2px #000}
    .rpg-cross::before{left:6px;top:0;width:2px;height:14px}
    .rpg-cross::after{left:0;top:6px;width:14px;height:2px}
    .rpg-vignette{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 120px 40px #ff1744;pointer-events:none}
    .rpg-danger{display:none;position:absolute;inset:0;box-shadow:inset 0 0 60px 14px #ff9100;animation:rpgblink .4s infinite;align-items:flex-end;justify-content:center;padding-bottom:150px;box-sizing:border-box}
    .rpg-danger span{background:#000a;border:1px solid #ff9100;border-radius:8px;padding:4px 14px;color:#ffcc80;font-weight:bold}
    .rpg-marker{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
    .rpg-marker i{position:absolute;left:-16px;top:-190px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:26px solid #ff1744;filter:drop-shadow(0 0 4px #000)}
    .rpg-fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15}
    .rpg-dmg-layer{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
    .rpg-dmg{position:absolute;left:0;top:0;font:bold 19px system-ui,sans-serif;text-shadow:0 0 3px #000,0 2px 4px #000;white-space:nowrap}
    /* ---- モーダル（看板の文） ---- */
    .rpg-modal{position:fixed;z-index:18;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8}
    .rpg-talk{left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,92vw);background:#0d1424ee;border:2px solid #c9a227;border-radius:12px;padding:14px 20px;cursor:pointer;box-shadow:0 8px 30px #000a}
    .rpg-talk-name{color:#ffd54f;font-weight:bold;margin-bottom:6px}
    .rpg-talk-text{font-size:17px;line-height:1.7;min-height:3em}
    .rpg-talk-next{text-align:right;color:#9fb1c2;font-size:12px;animation:rpgblink 1s infinite}
    @keyframes rpgblink{50%{opacity:.4}}
    /* ---- 必殺ゲージ・ブレイク・パーティ ---- */
    .rpg-skill.ready{border-color:#ffee58;box-shadow:0 0 10px #ffee58aa;animation:rpgblink .8s infinite}
    .rpg-gauge{position:absolute;left:0;bottom:0;height:4px;background:#ffee58}
    .rpg-brk{height:6px;background:#000b;border:1px solid #ffee5888;border-radius:3px;overflow:hidden;margin-top:3px}
    .rpg-brk>div{height:100%;background:linear-gradient(90deg,#f9a825,#ffee58);transition:width .2s}
    .rpg-boss.stun .rpg-brk{box-shadow:0 0 10px #ffee58}
    .rpg-party{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;font-size:12px}
    .rpg-party>div{background:#0b0f16b0;border:1px solid #30363d;border-radius:8px;padding:4px 8px;min-width:170px}
    .rpg-party .down{color:#ff5252;font-weight:bold}
    /* ---- レイドの準備画面（全滅時の選び直しも同じ枠） ----
       枠は縦の flex：見出し・名前/ルーム・ロールのタブ・職業の説明・[カード一覧＝ここだけスクロール]・ボタン */
    .rpg-lobby{position:fixed;inset:0;z-index:20;background:#05070bcc;display:flex;align-items:center;justify-content:center;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f0f4f8;padding:16px;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(16px,env(safe-area-inset-bottom))}
    .rpg-lobby-panel{background:#0d1424f2;border:1px solid #30363d;border-radius:14px;padding:12px 18px;width:min(1040px,100%);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;min-height:0}
    .rpg-lobby h2{margin:0 0 4px;color:#ffd54f;font-size:20px}
    .rpg-small{font-size:12px;color:#9fb1c2;line-height:1.6}
    .rpg-lobby-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;flex:none}
    .rpg-lobby-head h2{flex:1 1 auto}
    .rpg-lobby-head p{margin:0;flex-basis:100%}
    .rpg-lobby-head .rpg-lobby-row{flex:none;display:flex;align-items:center;gap:6px}
    .rpg-lobby-msg{color:#ffcc80}
    .rpg-lobby-row{margin:0}
    .rpg-lobby input{background:#000a;border:1px solid #58a6ff88;color:#fff;border-radius:8px;padding:8px 10px;font-size:16px;min-height:44px;box-sizing:border-box;font-family:inherit}
    .rpg-lobby-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
    .rpg-lobby .g3-btn{min-height:44px}
    .rpg-join{display:inline-flex;gap:6px;align-items:center}
    .rpg-join .rpg-code{width:7em}
    .rpg-room{background:#0b0f16;border:1px solid #30363d;border-radius:10px;padding:6px 12px;margin:0;flex:none}
    .rpg-room-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .rpg-room-code{font-size:26px;letter-spacing:.2em;color:#ffd54f}
    .rpg-jobpick{z-index:25}
    /* ロールのタブ（色の丸と職業の数）。狭いときは横にスクロール */
    .rpg-tabs{display:flex;gap:6px;flex:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .rpg-tabs::-webkit-scrollbar{display:none}
    .rpg-tab{flex:none;display:inline-flex;align-items:center;gap:5px;background:#0b0f16;border:1px solid #30363d;border-radius:10px;color:#9fb1c2;padding:6px 10px;min-height:40px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .rpg-tab i{width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 4px var(--rc)}
    .rpg-tab small{color:#6e7f90;font-size:11px}
    .rpg-tab.on{border-color:var(--rc);color:#fff;background:#1a2233;box-shadow:inset 0 0 0 1px var(--rc)}
    @media (max-width:720px){.rpg-tab small{display:none}.rpg-tab{padding:6px 8px;gap:4px}}
    /* ロールの札（職業の色ではなくロールの色） */
    .rpg-role{font-style:normal;font-size:10px;line-height:1.5;padding:0 5px;border-radius:4px;background:var(--rc);color:#000;font-weight:bold;white-space:nowrap}
    /* カード一覧（ここだけスクロール） */
    .rpg-jobgrid-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px}
    .rpg-jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
    .rpg-jobc{background:#0b0f16;border:2px solid #30363d;border-radius:10px;color:#dfe7ef;padding:5px 7px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;font:inherit;font-size:11px;line-height:1.3;min-width:0;text-align:left;-webkit-tap-highlight-color:transparent}
    .rpg-jobc b{color:var(--c);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .rpg-jobc-sub{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%}
    .rpg-jobc-sub .rpg-role{flex:none;font-size:9px}
    .rpg-jobc span{color:#9fb1c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .rpg-jobc.sel{border-color:var(--c);box-shadow:0 0 10px var(--c);background:#141c2e}
    /* 選んだ職業の説明：ふだんは1行、タップで技の説明まで開く */
    .rpg-jobinfo{flex:none;background:#0b0f16;border:1px solid var(--c);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.55;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .rpg-jobinfo-head{display:flex;align-items:center;gap:8px;min-height:28px;flex-wrap:wrap}
    .rpg-jobinfo-head>.rpg-small{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rpg-jobinfo-head u{text-decoration:none;color:#58a6ff;font-size:12px;white-space:nowrap;margin-left:auto}
    .rpg-jobinfo-body{display:none;margin-top:4px;border-top:1px solid #30363d;padding-top:4px}
    .rpg-jobinfo.open .rpg-jobinfo-body{display:block}
    .rpg-jobinfo b{color:var(--c);font-size:15px}
    .rpg-jobinfo em{font-style:normal;background:#ffd54f;color:#000;border-radius:3px;padding:0 4px;margin-right:4px;font-weight:bold}
    .rpg-jobinfo .trait{color:#ffe082}
    /* PC（高さのある画面）では説明をはじめから開いておく */
    @media (min-height:700px){.rpg-jobinfo-body{display:block}.rpg-jobinfo-head u{display:none}}
    /* ---- ルームの参加者（横並びの札）と準備完了のチェック ---- */
    .rpg-room .rpg-members{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0;padding:0;line-height:1.4}
    .rpg-mem{background:#141c2e;border:1px solid #30363d;border-radius:8px;padding:3px 8px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
    .rpg-mem.ready{border-color:#69f0ae}
    .rpg-check{font-style:normal;color:#00e676;font-weight:bold;font-size:15px;text-shadow:0 0 6px #00e67688}
    .g3-btn[disabled]{opacity:.45;cursor:not-allowed}
    /* ---- 頭上の名前と HP バー ---- */
    .rpg-plates{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden;font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
    .rpg-plate{position:absolute;left:0;top:0;text-align:center;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;font-size:12px;white-space:nowrap}
    .rpg-plate small{color:#cfd8dc;font-size:10px}
    .rpg-plate .bar{width:70px;height:6px;margin:2px auto 0;background:#000b;border:1px solid #ffffff44;border-radius:3px;overflow:hidden}
    .rpg-plate .bar>div{height:100%}
    .rpg-plate .dn{color:#ff5252;font-weight:bold}
    .rpg-plate.pinch .bar{border-color:#ff1744;box-shadow:0 0 8px #ff1744}
    .rpg-plate.pinch .nm{animation:rpgpinch .5s infinite}
    @keyframes rpgpinch{50%{color:#ff1744;text-shadow:0 0 8px #ff1744}}
    .rpg-plate.boss{font-size:14px;font-weight:bold;color:#ffccbc}
    .rpg-plate.boss .bar{width:120px;height:8px;border-color:#ff8a65}
    .rpg-plate.boss .bar>div{background:linear-gradient(90deg,#b71c1c,#ff5252)}
    .rpg-plate.boss.stun .bar{box-shadow:0 0 8px #ffee58}
    /* ---- スマホ（横持ち）のタッチ操作（src/ui/touch.js） ----
       配置（640×360 を基準）：左上＝状態、その下＝地図、左下＝スティック、上中央＝ボスHP、右上＝視点/全画面/ポーズ、右下＝攻撃まわり
       ノッチ・ホームバーは env(safe-area-inset-*) でよける。ボタンはすべて 44px 以上 */
    .rpg-touch{position:fixed;inset:0;z-index:13;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,"Hiragino Sans",sans-serif;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
    .rt-look{position:absolute;inset:0}
    .rt-stick{position:absolute;left:calc(190px + var(--sl));bottom:0;top:auto;width:0;height:0;pointer-events:none;transform:translateY(calc(-100px - var(--sb)));opacity:.4}
    .rt-stick.on{transform:none;opacity:1}
    .rt-base{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff66;background:#0b0f1666}
    .rt-knob{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:#ffffffaa;box-shadow:0 0 8px #000a}
    .rt-stick.dash .rt-knob{background:#ffee58;box-shadow:0 0 12px #ffee58}
    .rt-btn{position:absolute;border-radius:50%;border:2px solid #ffffff55;background:#0b0f16a8;color:#fff;font:bold 13px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
    .rt-btn b{font-size:16px;color:#ffd54f;line-height:1}
    .rt-btn span{font-size:9px;font-weight:normal;color:#cfd8dc;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rt-btn i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-style:normal;font-size:18px}
    .rt-btn u{position:absolute;left:0;right:0;bottom:0;background:#ffee5855;text-decoration:none;pointer-events:none}
    .rt-btn.down{background:#ffffff40;border-color:#fff}
    .rt-btn.off{opacity:.55}
    .rt-btn.ready{border-color:#ffee58;box-shadow:0 0 12px #ffee58;animation:rpgblink .8s infinite;opacity:1}
    .rt-atk{right:calc(20px + var(--sr));bottom:calc(20px + var(--sb));width:96px;height:96px;font-size:17px;border-color:#ff8a65aa}
    .rt-dodge{right:calc(126px + var(--sr));bottom:calc(12px + var(--sb));width:64px;height:64px}
    .rt-q{right:calc(138px + var(--sr));bottom:calc(86px + var(--sb));width:64px;height:64px}
    .rt-e{right:calc(84px + var(--sr));bottom:calc(140px + var(--sb));width:64px;height:64px}
    .rt-r{right:calc(14px + var(--sr));bottom:calc(132px + var(--sb));width:64px;height:64px}
    .rt-f{right:calc(212px + var(--sr));bottom:calc(156px + var(--sb));width:76px;height:46px;border-radius:12px;border-color:#ffd54f;color:#ffd54f;font-size:14px}
    /* 右上：視点・全画面・ポーズ（プレイ中は共通の「ハブへ戻る」を隠して、ここを空ける） */
    .rt-top{position:absolute;top:calc(8px + var(--st));right:calc(8px + var(--sr));display:flex;gap:6px}
    .rt-mini{border:1px solid #30363d;background:#0d1117cc;color:#c9d1d9;border-radius:8px;font:13px system-ui,sans-serif;min-width:44px;min-height:44px;padding:0 10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .rt-mini.rt-pause{font-size:18px}
    body.rpg-touch-on.rpg-ingame .g3-home{display:none}
    /* 縦持ちの案内 */
    .rpg-rotate{display:none;position:fixed;inset:0;z-index:60;background:#05070b;color:#fff;align-items:center;justify-content:center;text-align:center;font:18px/1.8 system-ui,"Hiragino Sans",sans-serif;padding:24px}
    .rpg-rotate b{color:#ffd54f}
    .rpg-rotate small{color:#9fb1c2;font-size:13px}
    .rpg-rotate-icon{font-size:56px;line-height:1.2;animation:rpgrotate 2s ease-in-out infinite}
    .rpg-rotate .g3-btn{margin-top:14px;min-height:44px}
    @keyframes rpgrotate{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
    @media (orientation:portrait){body.rpg-touch-on .rpg-rotate{display:flex}}
    /* タッチ時の HUD：スキル欄はボタンに映すので消す。各部品をタッチボタンとぶつからない場所へ */
    body.rpg-touch-on .rpg-skills{display:none}
    body.rpg-touch-on .g3-hud{left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
    body.rpg-touch-on .rpg-status{min-width:0;padding:6px 10px}
    body.rpg-touch-on .rpg-goal{max-width:220px;font-size:12px}
    body.rpg-touch-on .rpg-map{right:auto;left:calc(8px + env(safe-area-inset-left,0px));bottom:auto;top:calc(118px + env(safe-area-inset-top,0px));transform:scale(.45);transform-origin:top left;opacity:.85}
    body.rpg-touch-on .rpg-boss{top:calc(6px + env(safe-area-inset-top,0px));width:clamp(200px,100vw - 420px,440px)}
    body.rpg-touch-on .rpg-boss-name{font-size:13px}
    body.rpg-touch-on .rpg-boss-track{height:10px}
    body.rpg-touch-on .rpg-boss + .rpg-boss{top:calc(58px + env(safe-area-inset-top,0px))}
    body.rpg-touch-on .rpg-party{top:calc(214px + env(safe-area-inset-top,0px));right:auto;left:calc(8px + env(safe-area-inset-left,0px));transform:none;gap:2px;font-size:10px;max-height:calc(100vh - 226px - env(safe-area-inset-bottom,0px));overflow:hidden}
    body.rpg-touch-on .rpg-party>div{min-width:0;padding:2px 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;background:#0b0f16a0}
    body.rpg-touch-on .rpg-prompt{bottom:auto;top:66%;font-size:14px;padding:8px 14px;max-width:min(300px,calc(100vw - 460px));box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.rpg-touch-on .rpg-banner{top:30%;font-size:22px;letter-spacing:.1em;max-width:70vw;text-align:center;white-space:nowrap}

    body.rpg-touch-on canvas{touch-action:none}

    body.rpg-touch-on .rpg-talk{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
    /* 共通のオーバーレイ（タイトル・ポーズ・リザルト）：ボタンは 44px 以上、ノッチをよける */

    body.rpg-touch-on .g3-home::before{content:"⌂ ハブ";font-size:13px}
    body.rpg-touch-on .g3-overlay{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
    body.rpg-touch-on .rpg-lobby-head{padding-right:calc(70px + env(safe-area-inset-right,0px))}
    /* 背の低い画面（スマホの横持ち）：HUD とメニューを詰める */
    @media (max-height:520px){
      body .g3-hud{transform:scale(.75);transform-origin:top left}

      body .rpg-boss{width:min(420px,50vw)}

      body .rpg-banner{font-size:22px}
      body .rpg-talk{bottom:8px;padding:8px 14px}
      body .rpg-talk-text{font-size:14px;line-height:1.5;min-height:2.4em}
      body .rpg-talk-name{margin-bottom:2px}
      /* タイトルなど共通の枠：上下の余白を詰め、はみ出す分は枠の外側でスクロール */
      body .g3-overlay{overflow:auto;align-items:flex-start;padding:6px 0;box-sizing:border-box}
      body .g3-panel{padding:10px 16px;margin:auto;max-width:min(900px,96vw);box-sizing:border-box}
      body .g3-panel h1{font-size:1.2rem;margin-bottom:4px}
      body .g3-panel h2{font-size:1.1rem;margin-bottom:4px}
      body .g3-panel p{font-size:.82rem;margin-bottom:4px;line-height:1.45}
      body .g3-controls{font-size:.72rem;padding:6px 10px;margin-bottom:6px;line-height:1.5}
      body .g3-btn{padding:8px 14px;font-size:.9rem;min-height:44px}
      /* タイトル（操作説明の枠がある画面）だけ：説明と操作説明を左右に並べ、ボタンを2列にして 360px に収める */
      body .g3-panel:has(.g3-controls){display:grid;grid-template-columns:3fr 2fr;gap:2px 10px;text-align:left;align-items:start;padding:8px 14px}
      body .g3-panel:has(.g3-controls)>p{font-size:.72rem;line-height:1.4}
      body .g3-panel:has(.g3-controls)>.g3-controls{font-size:.66rem;line-height:1.45;padding:5px 8px}
      body .g3-panel:has(.g3-controls)>h1{font-size:1.05rem;margin:0 0 2px}
      body .g3-panel:has(.g3-controls)>h1{grid-column:1/-1;text-align:center}
      body .g3-panel:has(.g3-controls)>p{grid-column:1;margin:0}
      body .g3-panel:has(.g3-controls)>.g3-controls{grid-column:2;margin:0;align-self:stretch}
      body .g3-panel:has(.g3-controls)>.g3-btns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
      body .g3-panel:has(.g3-controls)>.g3-btns .g3-btn{padding:4px 8px;font-size:.8rem;line-height:1.25;min-height:44px}
      @media (min-width:600px){body .g3-panel:has(.g3-controls)>.g3-btns{grid-template-columns:1fr 1fr 1fr}}
      body .rpg-lobby{padding:6px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
      body .rpg-lobby-panel{padding:6px 10px;gap:5px;height:100%}
      body .rpg-lobby h2{font-size:15px;margin:0}
      body .rpg-lobby-hint{display:none}
      body .rpg-lobby .rpg-small{font-size:11px;line-height:1.4}
      body .rpg-jobgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}
      body .rpg-jobc{font-size:10px;padding:3px 6px;min-height:46px}
      body .rpg-jobc b{font-size:13px}
      body .rpg-jobinfo{font-size:11px;line-height:1.4;padding:3px 8px}
      body .rpg-jobinfo b{font-size:14px}
      body .rpg-jobinfo-head{min-height:26px}
      body .rpg-tab{min-height:44px;padding:4px 9px;font-size:12px}
      body .rpg-room{padding:4px 10px}
      body .rpg-room-code{font-size:20px}
      body .rpg-room{display:flex;align-items:center;gap:10px;min-height:44px}
      body .rpg-room-line{flex:none;white-space:nowrap}
      body .rpg-room .rpg-members{flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0}
      body .rpg-room .rpg-members::-webkit-scrollbar{display:none}
      body .rpg-mem{flex:none}
      body .rpg-lobby input{min-height:44px;padding:6px 10px}
      body .rpg-lobby .g3-btn{min-height:44px;padding:6px 12px}
      body .g3-toast{font-size:13px;padding:6px 12px}
    }
  </style>
